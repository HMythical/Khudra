name: CI - Linux

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'utils/**'
      - 'lib/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'utils/**'
      - 'lib/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci-linux.yml'

jobs:
  build:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (Debug)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (sanitized)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DKHU_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan --parallel

      # The memory systems are the reason this job exists: the collector, the
      # manual arenas and the pin bookkeeping all have to come out clean.
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
