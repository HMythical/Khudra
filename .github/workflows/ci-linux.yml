name: CI - Linux

on:
  push:
    # main is the deploy branch and dev is where the work lands, so both gate on
    # a green build. No path filter: a required status check that never runs
    # leaves a pull request waiting on it forever, and the whole run is seconds.
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (Debug)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (sanitized)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DKHU_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan --parallel

      # The memory systems are the reason this job exists: the collector, the
      # manual arenas and the pin bookkeeping all have to come out clean.
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
